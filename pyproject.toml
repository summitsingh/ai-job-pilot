[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-pilot"
version = "0.1.0"
description = "Deterministic, low-token autofill for ATS job application forms"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Summit Singh Thakur" }]
keywords = ["ats", "greenhouse", "ashby", "lever", "job-application", "autofill"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
]

[project.scripts]
ai-job-pilot = "ats_fill:main"
ai-job-pilot-batch = "batch_apply:main"
ai-job-pilot-code-gate = "code_gate:main"
ai-job-pilot-lane = "lane_greenhouse:main"
ai-job-pilot-sweep = "sweep:main"
ai-job-pilot-track = "tracker:main"
ai-job-pilot-launch = "launch_browsers:main"
ai-job-pilot-setup = "setup_wizard:main"
ai-job-pilot-queue = "job_queue:main"
ai-job-pilot-scoreboard = "scoreboard:main"
ai-job-pilot-analytics = "analytics:main"

[project.urls]
Homepage = "https://github.com/summitsingh/ai-job-pilot"
Repository = "https://github.com/summitsingh/ai-job-pilot"

[tool.setuptools]
py-modules = [
    "ats_fill",
    "batch_apply",
    "code_gate",
    "codegate",
    "setup_wizard",
    "launch_browsers",
    "job_queue",
    "config",
    "tracker",
    "lane_greenhouse",
    "location_check",
    "submit_watchdog",
    "sweep",
    "submit_only",
    "extract",
    "schema_dump",
    "map",
    "fill",
    "hard_patterns",
    "templates",
    "set_select",
    "set_select2",
    "modal_common",
    "verify",
    "cdp_driver",
    "cdp_direct",
    "common",
    "model",
    "indeed_dump",
    "indeed_fill",
    "scoreboard",
    "analytics",
    "terminal_output",
]
